<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main id="game">
        <h1 id="title">Number Guessing Game</h1>

        <div>Enter a Number between 1 to 100 :
            <span id="numberInput"></span>
        </div>

        <div>Your Entered Numbers :
            <span id="enteredNumbers"></span>
        </div>

        <div>Attempt :
            <span id="attempts">10</span>
        </div>

        <div id="result"></div>

        <div id="digits">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
        </div>

        <div>
            <button id="clearButton">Clear Number</button>
            <button id="submitButton">Submit Number</button>
        </div>
    </main>
</body>
<script src="script.js"></script>
</html>
